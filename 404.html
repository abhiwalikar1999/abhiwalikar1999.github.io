<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Abhishek Walikar</title>
  <meta name="robots" content="noindex">
  <!-- Root-relative paths: a 404 page can be served from any URL depth. -->
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
  <main class="wrap notfound">
    <p class="eyebrow">Error 404</p>
    <h1>This page doesn't exist.</h1>
    <p>The link may be outdated, or the address may have a typo.</p>
    <div class="hero-actions">
      <a class="btn" href="/">Go to the homepage</a>
      <a class="btn btn--ghost" href="/#projects">See the projects</a>
    </div>
  </main>
</body>
</html>
